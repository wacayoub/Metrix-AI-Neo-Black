name: Validate and prepare IPK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/fetch_pinned_sources.py
      - run: python tools/release_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: metrix-neo-not-installed
          path: |
            dist/
            reports/
            previews/
