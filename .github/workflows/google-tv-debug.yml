name: Metrix NEO AI TV APK
on:
  push:
    branches: [codex/metrix-neo-ai-google-tv]
    paths:
      - 'google-tv/**'
      - '.github/workflows/google-tv-debug.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: google-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Android TV debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MetrixNEO-AI-Sony-TV-debug-apk
          path: google-tv/app/build/outputs/apk/debug/*.apk
