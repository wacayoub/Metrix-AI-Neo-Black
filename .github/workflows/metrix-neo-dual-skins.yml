name: Metrix NEO dual skins - offline validation
on:
  push:
    paths:
      - 'dual-skins/**'
      - '.github/workflows/metrix-neo-dual-skins.yml'
  pull_request:
    paths:
      - 'dual-skins/**'
      - '.github/workflows/metrix-neo-dual-skins.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: dual-skins
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/fetch_pinned_sources.py
      - run: python tools/release_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: metrix-neo-dual-skins-NOT-INSTALLED
          path: |
            dual-skins/dist/
            dual-skins/reports/
            dual-skins/previews/
